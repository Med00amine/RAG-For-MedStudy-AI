services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LOG_JSON: "true"
    volumes:
      - chroma-data:/app/data
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  chroma-data:
