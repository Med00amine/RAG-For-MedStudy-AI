<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision Médecine</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5b6475;
    --border: #e1e5ec; --accent: #0f766e; --accent-soft: #e6f4f2; --user: #0f766e;
    --user-text: #ffffff; --warn: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419; --panel: #171d24; --text: #e6e9ee; --muted: #9aa4b2;
      --border: #2a323d; --accent: #2dd4bf; --accent-soft: #12302d; --user: #115e59;
      --user-text: #ecfeff; --warn: #fdba74;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font-size: 1.1rem; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .thread { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 12px 14px; border-radius: 12px; max-width: 100%; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); max-width: 85%; }
  .bot { background: var(--panel); border: 1px solid var(--border); }
  .bot h4 { margin: 10px 0 4px; font-size: 1rem; }
  .bot ul, .bot ol { margin: 4px 0; padding-left: 22px; }
  .bot p { margin: 6px 0; }
  .cite { color: var(--accent); font-weight: 600; text-decoration: none; font-size: .85em; }
  .error { color: var(--warn); }
  .sources { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .sources > span { font-size: .8rem; color: var(--muted); text-transform: uppercase; }
  details { margin: 6px 0; padding: 6px 10px; border-radius: 8px; background: var(--accent-soft); }
  details:target { outline: 2px solid var(--accent); }
  summary { cursor: pointer; font-size: .9rem; }
  summary small { color: var(--muted); display: block; }
  details pre {
    white-space: pre-wrap; font-family: inherit; font-size: .85rem; line-height: 1.45;
    margin: 6px 0 0; color: var(--muted);
  }
  .empty { text-align: center; color: var(--muted); margin-top: 8vh; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  .chips button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font: inherit; font-size: .9rem; cursor: pointer;
  }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  form > div { flex: 1; max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font: inherit; background: var(--bg); color: var(--text); max-height: 160px;
  }
  form button {
    border: 0; border-radius: 10px; padding: 0 18px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
  .typing::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <h1>Assistant de révision — Médecine</h1>
  <p>Réponses tirées de vos cours, avec les diapos à revoir. Outil de révision, pas un avis médical.</p>
</header>
<main id="scroll">
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <p>Pose une question sur tes cours : définition, classification, conduite à tenir…</p>
      <div class="chips">
        <button type="button">Classification de Gharbi du kyste hydatique du foie</button>
        <button type="button">Signes ECG de l'hyperkaliémie</button>
        <button type="button">Conduite à tenir devant une hémorragie du post-partum</button>
        <button type="button">Contre-indications du DIU</button>
      </div>
    </div>
  </div>
</main>
<form id="form">
  <div>
    <textarea id="input" rows="1" placeholder="Ta question…" aria-label="Question"></textarea>
    <button id="send" disabled>Envoyer</button>
  </div>
</form>
<script>
const thread = document.getElementById("thread");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = [];  // [{role, content}] sent back so follow-up questions work
let turn = 0;

const escape = (s) => s.replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

// Small, safe Markdown subset: escape first, then headings, lists, bold and [n] citations.
function render(md, id) {
  const html = [];
  let list = null;
  for (const raw of escape(md).split("\n")) {
    const line = raw
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[(\d+)\]/g, `<a class="cite" href="#src-${id}-$1">[$1]</a>`);
    const item = line.match(/^\s*(?:[-*•]|(\d+)[.)])\s+(.*)$/);
    if (item) {
      const tag = item[1] ? "ol" : "ul";
      if (list !== tag) {
        if (list) html.push(`</${list}>`);
        // keep "1. Réponse … 2. Exemple" numbered even with bullet lists in between
        html.push(tag === "ol" ? `<ol start="${item[1]}">` : "<ul>");
        list = tag;
      }
      html.push(`<li>${item[2]}</li>`);
      continue;
    }
    if (list) { html.push(`</${list}>`); list = null; }
    const heading = line.match(/^#{1,4}\s+(.*)$/);
    if (heading) html.push(`<h4>${heading[1]}</h4>`);
    else if (line.trim()) html.push(`<p>${line}</p>`);
  }
  if (list) html.push(`</${list}>`);
  return html.join("");
}

function renderSources(sources, id) {
  if (!sources.length) return "";
  const cards = sources.map((s, i) => {
    const module = s.source.split("/").slice(-3, -1).join(" › ");
    return `<details id="src-${id}-${i + 1}"><summary>[${i + 1}] ${escape(s.location)}` +
      `<small>${escape(module)}</small></summary><pre>${escape(s.text)}</pre></details>`;
  });
  return `<div class="sources"><span>Où réviser</span>${cards.join("")}</div>`;
}

function add(cls, html) {
  document.getElementById("empty")?.remove();
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.innerHTML = html;
  thread.appendChild(div);
  div.scrollIntoView({block: "end"});
  return div;
}

async function ask(question) {
  const id = ++turn;
  add("user", escape(question));
  const bot = add("bot typing", "");
  input.value = ""; send.disabled = true; input.disabled = true;

  let answer = "", sources = [], failed = false;
  const show = () => { bot.innerHTML = render(answer, id) + renderSources(sources, id); };
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question, history: history.slice(-6)}),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines.filter(Boolean)) {
        const event = JSON.parse(line);
        if (event.type === "sources") sources = event.sources;
        if (event.type === "token") answer += event.text;
        if (event.type === "error") failed = true;
        show();
      }
    }
  } catch (err) {
    failed = true;
  }
  bot.classList.remove("typing");
  if (failed) {
    bot.innerHTML += `<p class="error">Le modèle ne répond pas. Vérifie qu'Ollama est lancé, puis réessaie.</p>`;
  } else {
    history.push({role: "user", content: question}, {role: "assistant", content: answer});
  }
  input.disabled = false; input.focus();
}

input.addEventListener("input", () => {
  send.disabled = input.value.trim().length < 3;
  input.style.height = "auto";
  input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!send.disabled) ask(input.value.trim()); }
});
document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!send.disabled) ask(input.value.trim());
});
document.querySelectorAll(".chips button").forEach((b) => b.addEventListener("click", () => ask(b.textContent)));
</script>
</body>
</html>
